{id:'companion',title:'Not Good to Be Alone',desc:'Walk toward the sunlit glade. A defining moment in the story is waiting.',ref:'Genesis 2:18–23',target:1,label:'Visit the quiet glade',kind:'glade',intro:'aloneIntro',done:'eveAppears'},

{id:'offering',title:'Two Offerings',desc:'The biblical account turns from everyday work to the tragedy of Cain and Abel.',ref:'Genesis 4:3–16',target:1,label:'Experience Cain and Abel’s account',kind:'narrative',intro:'offeringIntro',done:'offeringDone'},

const STORIES={
gardenIntro:{eyebrow:'THE BOOK OF BEGINNINGS',title:'In the Beginning',body:'The earth is young, and the garden stands full of life. The LORD God has placed Adam in Eden, giving him a calling before kingdoms, cities, or generations have begun. This is where your story starts.',verse:'And the LORD God took the man, and put him into the garden of Eden to dress it and to keep it.',ref:'Genesis 2:15 · KJV'},
gardenDone:{eyebrow:'THE FIRST TASK COMPLETE',title:'A Garden to Keep',body:'The beds are tended, and the land flourishes. Work in Eden was part of Adam’s calling before sin entered the world. The LORD God declares that it is not good for man to be alone. Then the living creatures are brought before him.',verse:'And the LORD God said, It is not good that the man should be alone; I will make him an help meet for him.',ref:'Genesis 2:18 · KJV'},
animalsIntro:{eyebrow:'CHAPTER TWO',title:'Every Living Creature',body:'The animals of the field and the birds of the air are brought before Adam. Explore the garden and name the four creatures marked with a golden shimmer. You may choose their names in this dramatized experience.',verse:'And Adam gave names to all cattle, and to the fowl of the air, and to every beast of the field;',ref:'Genesis 2:20 · KJV'},
animalsDone:{eyebrow:'STORY UNLOCKED',title:'A Name for Every Creature',body:'Adam has named the creatures. Yet among all the living things, there is not a companion corresponding to him. A new moment is approaching.',verse:'but for Adam there was not found an help meet for him.',ref:'Genesis 2:20 · KJV'},
aloneIntro:{eyebrow:'CHAPTER TWO',title:'The Quiet Glade',body:'The LORD has already declared that man should not be alone. Though the creatures are named, no corresponding helper is found for Adam. Return to the clearing for the next narrated moment, without attempting to portray God in human form.',verse:'And the LORD God caused a deep sleep to fall upon Adam, and he slept:',ref:'Genesis 2:21 · KJV'},

togetherIntro:{eyebrow:'CHAPTER TWO',title:'Life Together',body:'Two people, one garden, and work to share. Gather fruit from the orchard, then speak with Eve. These daily activities are creative additions to help you inhabit the setting.',verse:'And they were both naked, the man and his wife, and were not ashamed.',ref:'Genesis 2:25 · KJV'},
togetherDone:{eyebrow:'THE STORY CONTINUES',title:'A Beautiful Beginning',body:'The garden is peaceful, and Adam and Eve care for its abundance. But a command has been given concerning a particular tree. The biblical story now approaches a turning point.',verse:'But of the tree of the knowledge of good and evil, thou shalt not eat of it:',ref:'Genesis 2:17 · KJV'},
choiceIntro:{eyebrow:'GENESIS THREE',title:'The Command and the Choice',body:'The serpent questions the command of God. Eve and Adam disobey, and sin enters their story. These events are fixed biblical milestones; the player cannot change the account. Select “Continue the account” when ready.',verse:'And the eyes of them both were opened, and they knew that they were naked;',ref:'Genesis 3:7 · KJV'},
fallDone:{eyebrow:'BEYOND THE GARDEN',title:'Clothed and Sent Out',body:'God addresses the man and the woman, makes coats of skins for them, and sends Adam out to cultivate the ground. The garden can no longer be entered. A new settlement begins east of Eden.',verse:'Unto Adam also and to his wife did the LORD God make coats of skins, and clothed them.',ref:'Genesis 3:21 · KJV'},
exileIntro:{eyebrow:'GENESIS THREE',title:'The Ground Outside',body:'Life beyond Eden is different. The soil demands labor, and Adam’s family must work the land. Begin preparing three fields to feed the future generations.',verse:'In the sweat of thy face shalt thou eat bread, till thou return unto the ground;',ref:'Genesis 3:19 · KJV'},

}
return ''}

let audio=null;function beep(freq=540,dur=.08){if(!s.music)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!audio)audio=new AC();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.024;g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}

function action(obj){if(!obj)return;const quest=completed()?null:q();const key=(s.scene==='garden'?'g':'h')+obj.id;if(obj.type==='plot'){if(s.donePlots[key]){notify('This field is already tended. A new day will refresh it.');return;}s.donePlots[key]=true;s.counts.wood+=s.scene==='garden'?0:1;s.counts.seed=Math.max(0,s.counts.seed-1);s.counts.fruit++;beep(570,.13);notify(s.scene==='garden'?'Garden soil tended ✦ +1 fruit':'Field prepared ✦ +1 fruit, +1 wood');if(quest?.kind==='plot')finish();else if(quest?.kind==='brothers'&&!s.brotherActions.includes('field')){s.brotherActions.push('field');finish();}save();updateHUD();return;}

if(obj.type==='tree'){s.counts.fruit+=2;notify('You gathered two pieces of fruit 🍎 +2');beep(700,.1);if(quest?.id==='life'&&s.lifeActions.filter(x=>x==='fruit').length<2){s.lifeActions.push('fruit');finish();}save();updateHUD();return;}
if(obj.type==='build'){if(s.build){notify('The family shelter offers a place to gather.');return;}if(quest?.kind==='build'){if(s.counts.wood<3){notify('Need 3 wood. Try tending more fields.');return;}s.counts.wood-=3;finish();save();updateHUD();}else notify('A place suitable for a future shelter.');return;}
if(obj.type==='flock'){notify('The flock is tended 🐑');beep(600,.11);if(quest?.kind==='brothers'&&!s.brotherActions.includes('flock')){s.brotherActions.push('flock');finish();}return;}

const lessons=[{id:'work',name:'The Gift of Work',ref:'Genesis 2:15',quote:'to dress it and to keep it.',teaching:'God entrusted the garden to Adam. Stewardship is a responsibility.'},{id:'word',name:'Remember the Command',ref:'Genesis 2:16–17',quote:'Of every tree of the garden thou mayest freely eat:',teaching:'God gave both provision and a command. Remembering His word matters.'},{id:'provision',name:'The Clothing of Skin',ref:'Genesis 3:21',quote:'make coats of skins, and clothed them.',teaching:'After the Fall, Scripture records that God clothed Adam and his wife.'},{id:'guard',name:'A Warning About Sin',ref:'Genesis 4:7',quote:'sin lieth at the door.',teaching:'Cain was warned before his grave sin. The story teaches the danger of anger and refusing correction.'}];

function seekQuest(){if(completed()){openPanel('map');return;}let kind=q().kind;if(kind==='narrative'){finish();return}if(kind==='map'){finish();openPanel('map');return;}if(q().kind==='plot'&&s.scene!==(s.quest===0?'garden':'home'))goScene(s.quest===0?'garden':'home');if(kind==='brothers'&&s.scene!=='home')goScene('home');const objects=getObjects();let target=null;if(kind==='plot')target=objects.find(o=>o.type==='plot'&&!s.donePlots[(s.scene==='garden'?'g':'h')+o.id]);else if(kind==='animal')target=objects.find(o=>o.type==='animal'&&!s.named[o.id]);else if(kind==='glade')target=objects.find(o=>o.type==='glade');else if(kind==='mixed')target=objects.find(o=>o.type===(s.lifeActions.filter(x=>x==='fruit').length<2?'tree':'eve'));else if(kind==='build')target=objects.find(o=>o.type==='build');else if(kind==='brothers')target=objects.find(o=>o.type===(!s.brotherActions.includes('field')?'plot':'flock'));if(!target){notify('Explore the highlighted objects to continue.');return;}const c=characters[s.selected];c.tx=target.x-36;c.ty=target.y+18;c.action=target.id;notify('Follow the golden path ✦');}
